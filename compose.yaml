
services:
  app:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-BeautySchedule}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:?Informe DB_ROOT_PASSWORD}
      SERVICE_URL_APP: /
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    ports:
      - "3310:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-BeautySchedule}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Informe DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
